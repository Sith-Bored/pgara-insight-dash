name: Reproducibility checks

on:
  push:
    branches:
      - main
      - "reproducibility/**"
    paths-ignore:
      - "verified-results.json"
  pull_request:
    paths-ignore:
      - "verified-results.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install frontend dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        run: bun run test

      - name: Build frontend
        run: bun run build

      - name: Generate benchmark results
        if: github.event_name != 'pull_request'
        working-directory: backend
        run: python scripts/generate_verified_results.py

      - name: Check generated results against implementation
        if: github.event_name == 'pull_request'
        working-directory: backend
        run: python scripts/generate_verified_results.py --check

      - name: Upload generated results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-results-${{ github.sha }}
          path: verified-results.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit refreshed benchmark results
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- verified-results.json; then
            echo "verified-results.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verified-results.json
          git commit -m "Regenerate PGARA benchmark results"
          git push
